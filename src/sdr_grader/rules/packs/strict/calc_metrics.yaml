category: calc_metric_maint
description: |
  Calculated metric maintainability rules — descriptions, references,
  complexity, attribution variety, and near-duplicate detection.

rules:
  - id: CALC-001
    name: Calculated metrics lacking descriptions
    severity: low               # demoted after historical cohort review
    platforms: [cja, aa]
    check: calc_metrics_missing_descriptions
    params:
      # Historically set from descriptive observations on 31 calc-metric-
      # bearing compatibility snapshots; this was not an admitted
      # calibration cohort.
      threshold: 0.95
    rationale: |
      Calculated metrics carry definitional choices (attribution, allocation,
      formula assumptions) that are invisible from the formula alone. Real-
      world adoption of calc-metric descriptions is essentially zero in the
      historical compatibility cohort. The maintainer-selected threshold
      flags only the most undocumented tenants, and the low severity keeps
      this rule from dominating a grade.
    remediation: |
      Add concise descriptions explaining what the metric measures, when to
      use it, and which attribution / allocation choices were made.

  - id: CALC-002
    name: Formula references unresolved in the exported inventory
    severity: medium
    platforms: [cja, aa]
    check: calc_formula_broken_refs
    params:
      exclude_unresolved_calculated_metric_segments: true
    rationale: |
      Formula references absent from an export require source-platform
      verification before treating the live implementation as broken.
      Explicitly typed calculated-metric-to-segment references remain unverified
      and unscored when unresolved; invalid references in that category are also
      unscored. Other unresolved references retain their existing penalties.
    remediation: |
      Verify each scored unresolved ID in the source platform and export the relevant
      inventory for the correct data view or report suite. If the reference is
      confirmed invalid, restore the component or update its consumers.

  - id: CALC-003
    name: Formula complexity score exceeds threshold
    severity: low
    platforms: [cja, aa]
    check: calc_complexity_threshold
    params:
      # Maintainer-selected near the historical compatibility-cohort p90.
      max_complexity: 22
    rationale: |
      High-complexity formulas are hard to review and easy to miscalibrate.
      Beyond a certain threshold, the formula stops being self-documenting.
    remediation: |
      Decompose the metric into intermediate calculated metrics whose names
      describe what each step measures.

  # CALC-005 (orphan_calc_metrics) is registered but not in the default
  # packs. Same reasoning as SEG-003: calc metrics are referenced by
  # Workspace projects and dashboards, not other calc metrics or segments,
  # so the in-snapshot orphan signal is universally degenerate (every
  # calc-bearing tenant in the historical 108-snapshot compatibility cohort
  # was at 100% orphan).

  - id: CALC-014
    name: Near-duplicate calculated metrics
    severity: high
    platforms: [cja, aa]
    check: calc_near_duplicates
    params:
      min_similarity: 0.85
    rationale: |
      Near-duplicates produce subtly different numbers in different reports
      and surface as &ldquo;the dashboards disagree&rdquo; complaints from
      executives.
    remediation: |
      Designate one canonical metric per concept, document its choices, and
      deprecate the others by tagging them with a sunset date.

  - id: CALC-015
    name: Identical formula text across distinct calculated metrics
    severity: medium
    platforms: [cja, aa]
    check: calc_identical_formula_text
    params: {}
    rationale: |
      Identical formulas are a red flag for accidental copy-paste rather
      than intentional duplication.
    remediation: |
      Pick one canonical metric, redirect consumers, and archive the
      duplicates.
