category: schema_hygiene
description: |
  Schema hygiene rules — pragmatic thresholds (looser than strict).

rules:
  - id: SCH-001
    name: Duplicate component names within the same component type
    severity: medium
    platforms: [cja, aa]
    check: duplicate_component_names
    params:
      targets: [metrics, dimensions, derived_fields]
    rationale: Same as strict.
    remediation: Same as strict.

  - id: SCH-002
    name: References unresolved in the exported inventory
    severity: high
    platforms: [cja, aa]
    check: broken_references
    params: {}
    rationale: |
      References absent from an export can indicate a deleted component or
      an omitted inventory. The snapshot alone cannot establish live validity.
    remediation: |
      Verify each unresolved ID in the source platform and export the relevant
      inventory for the correct data view or report suite. If the reference is
      confirmed invalid, restore the component or update its consumers.

  - id: SCH-003
    name: Components lacking descriptions
    severity: low                # severity demoted in pragmatic
    platforms: [cja, aa]
    check: missing_descriptions
    params:
      # Historically set near p95 in a descriptive 108-snapshot compatibility
      # run using the pack 2.0 maximum per-target statistic. This was not an
      # admitted calibration cohort.
      threshold: 0.81
      targets: [metrics, dimensions]
    rationale: Same as strict.
    remediation: Same as strict.

  - id: SCH-004
    name: Type-name mismatches
    severity: low
    platforms: [cja, aa]
    check: type_name_mismatch
    params: {}
    rationale: Same as strict.
    remediation: Same as strict.

  - id: SCH-005
    name: Deprecated components still in use
    severity: low
    platforms: [cja, aa]
    check: deprecated_components
    params: {}
    rationale: Same as strict.
    remediation: Same as strict.

  - id: SCH-007
    name: Persistence lookback exceeds 90-day platform cap
    severity: low                # demoted from strict's medium
    platforms: [cja]
    check: persistence_lookback_exceeds_cap
    params:
      cap_days: 90
    rationale: Same as strict.
    remediation: Same as strict.

  - id: SCH-008
    name: Derived field circular references
    severity: medium             # demoted from strict's high
    platforms: [cja]
    check: derived_field_cycles
    params: {}
    rationale: Same as strict.
    remediation: Same as strict.

  - id: SCH-009
    name: Derived field references unresolved in the exported inventory
    severity: medium             # demoted from strict's high
    platforms: [cja]
    check: derived_field_broken_refs
    params: {}
    rationale: |
      Derived-field references absent from an export require source-platform
      verification. Established dimension aliases and recognized built-ins
      are resolved without equating metric and dimension namespaces.
    remediation: |
      Verify each unresolved ID in the source platform and export the relevant
      inventory for the correct data view or report suite. If the reference is
      confirmed invalid, restore the component or update its consumers.
