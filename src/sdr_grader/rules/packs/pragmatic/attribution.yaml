category: attribution_coverage
description: Pragmatic attribution rules — same IDs as strict, looser thresholds.

# ATTR-001 and ATTR-002 were demoted to opt-in after the May 2026 audit. A
# historical descriptive run against the 108-fixture compatibility cohort
# found both distributions degenerate. See strict/attribution.yaml and
# docs/RUBRIC_AUDIT.md.

rules:
  - id: AA-001
    name: eVar allocation and expiration differ from expectations
    severity: high
    platforms: [aa]
    check: aa_allocation_expiration
    rationale: Compare sourced configuration with explicit business expectations.
    remediation: Review the declared expectation and correct the report-suite configuration if needed.

  - id: AA-004
    name: Merchandising configuration differs from expectations
    severity: high
    platforms: [aa]
    check: aa_merchandising
    rationale: Compare sourced configuration with explicit business expectations.
    remediation: Review the declared expectation and correct the report-suite configuration if needed.

  - id: ATTR-003
    name: Inconsistent attribution choices across similar metrics
    severity: low
    platforms: [cja, aa]
    check: attribution_inconsistency
    params: {}
    rationale: Same as strict.
    remediation: Same as strict.

  - id: ATTR-004
    name: Data View metric attribution override not documented in description
    severity: low                # demoted from strict's medium
    platforms: [cja]
    check: attribution_setting_undocumented
    params: {}
    rationale: Same as strict.
    remediation: Same as strict.
