category: calc_metric_maint
description: Pragmatic calc metric rules — same IDs as strict, looser thresholds.

rules:
  - id: CALC-001
    name: Calculated metrics lacking descriptions
    severity: low
    platforms: [cja, aa]
    check: calc_metrics_missing_descriptions
    params:
      threshold: 1.00           # pragmatic: fire only when every calc
                                # metric lacks a description
    rationale: Same as strict.
    remediation: Same as strict.

  - id: CALC-002
    name: Formula references unresolved in the exported inventory
    severity: medium
    platforms: [cja, aa]
    check: calc_formula_broken_refs
    params: {}
    rationale: |
      Formula references absent from an export require source-platform
      verification before treating the live implementation as broken.
    remediation: |
      Verify each unresolved ID in the source platform and export the relevant
      inventory for the correct data view or report suite. If the reference is
      confirmed invalid, restore the component or update its consumers.

  - id: CALC-003
    name: Formula complexity score exceeds threshold
    severity: low
    platforms: [cja, aa]
    check: calc_complexity_threshold
    params:
      # Maintainer-selected near the historical compatibility-cohort p95.
      max_complexity: 30
    rationale: Same as strict.
    remediation: Same as strict.

  # CALC-005 unwired: see strict pack note.

  - id: CALC-014
    name: Near-duplicate calculated metrics
    severity: medium             # demoted from high
    platforms: [cja, aa]
    check: calc_near_duplicates
    params:
      min_similarity: 0.95       # 0.95 vs strict 0.85
    rationale: Same as strict.
    remediation: Same as strict.

  - id: CALC-015
    name: Identical formula text across distinct calculated metrics
    severity: low                # demoted from medium
    platforms: [cja, aa]
    check: calc_identical_formula_text
    params: {}
    rationale: Same as strict.
    remediation: Same as strict.
