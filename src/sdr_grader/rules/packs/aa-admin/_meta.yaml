pack: aa-admin
version: "1.0"
description: Optional AA administration checks against declared expectations.
category_weights:
  aa_administration: 1.0

severity_weights:
  critical: 4
  high:     3
  medium:   2
  low:      1

# Letter grade thresholds. Score is 0-100. Bands are descending.
grade_scale:
  - { min: 93, grade: "A"  }
  - { min: 90, grade: "A−" }
  - { min: 87, grade: "B+" }
  - { min: 83, grade: "B"  }
  - { min: 80, grade: "B−" }
  - { min: 77, grade: "C+" }
  - { min: 73, grade: "C"  }
  - { min: 70, grade: "C−" }
  - { min: 67, grade: "D+" }
  - { min: 63, grade: "D"  }
  - { min: 60, grade: "D−" }
  - { min: 0,  grade: "F"  }
