name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Dispatch has no publication mode: every dispatch is a nonpublishing harness.
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        default: success
        options: [success, fail-once, fail-later, skip, cancel, discovery, exhausted, mismatch, source-mismatch]
      version:
        description: Exact checked-out package version for nonpublishing verification
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}-${{ inputs.scenario || 'production' }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  HARNESS_MODE: ${{ github.event_name == 'workflow_dispatch' }}
  HARNESS_SCENARIO: ${{ inputs.scenario || 'success' }}

jobs:
  candidate:
    name: Release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Enforce caller mode and frozen identity
        env:
          CALLER_WORKFLOW: ${{ github.workflow_ref }}
        run: python3 scripts/release_verifier_fixture.py guard

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.16
          enable-cache: true
          prune-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: uv sync --locked --all-extras --dev

      - name: Verify immutable candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 scripts/check_version_sync.py --tag "v${RELEASE_VERSION#v}"

      - name: Lint
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: uv run ruff check

      - name: Test
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: uv run pytest --cov=src/sdr_grader --cov-report=term

  build:
    name: Build immutable distributions
    needs: candidate
    # A failed immutable build requires a fixed source and new version. Rerunning
    # failed verifier jobs may reuse retained artifacts, but no run may rebuild.
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.16

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify immutable candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 scripts/check_version_sync.py --tag "v${RELEASE_VERSION#v}"

      - name: Build wheel from sdist
        run: uv build --no-sources --clear --no-create-gitignore

      - name: Install hash-locked release validation tools
        run: |
          uv venv --python 3.12 .release-validation
          uv pip install \
            --python .release-validation/bin/python \
            --require-hashes -r requirements/release-validation.txt

      - name: Validate distribution descriptions strictly
        run: .release-validation/bin/twine check --strict dist/*

      - name: Verify artifact inventory and provenance
        run: |
          mkdir -p release-evidence
          .release-validation/bin/python scripts/verify_release_artifacts.py \
            --dist-dir dist \
            --expected-version "${RELEASE_VERSION#v}" \
            --source-sha "${GITHUB_SHA}" \
            --output release-evidence/release-artifacts.json

      - name: Attest immutable distributions for rerun recovery
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Upload immutable distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-evidence-${{ github.sha }}
          path: release-evidence/release-artifacts.json
          if-no-files-found: error
          retention-days: 30

  recover:
    name: Recover immutable artifacts
    needs: candidate
    if: github.run_attempt > 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub's workflow read token cannot see draft releases. Confine this
    # permission to recovery; never install or execute the recovered package here.
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Recover and verify frozen release candidate
        uses: ./.github/actions/fetch-release-candidate
        with:
          source: ${{ github.event_name == 'workflow_dispatch' && 'artifacts' || 'auto' }}
          token: ${{ github.token }}
          version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          harness: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Retain recovered distributions for read-only consumers
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-dist-${{ github.sha }}-recovery-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Retain recovered evidence for read-only consumers
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-evidence-${{ github.sha }}-recovery-${{ github.run_attempt }}
          path: release-evidence/release-artifacts.json
          if-no-files-found: error
          retention-days: 30

  install-smoke:
    name: Artifact smoke / Python ${{ matrix.python-version }}
    needs: [candidate, build, recover]
    if: >-
      ${{
        always() &&
        needs.candidate.result == 'success' &&
        (needs.build.result == 'success' || needs.recover.result == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.16

      - name: Fetch frozen release candidate
        uses: ./.github/actions/fetch-release-candidate
        with:
          token: ${{ github.token }}
          version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          harness: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Install wheel and sdist outside checkout and compare behavior
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_ROOT="${RUNNER_TEMP}/artifact-smoke-${{ matrix.python-version }}"
          mkdir -p "${SMOKE_ROOT}"
          for KIND in wheel sdist; do
            if [ "${KIND}" = "wheel" ]; then
              ARTIFACT=( "${GITHUB_WORKSPACE}"/dist/*.whl )
            else
              ARTIFACT=( "${GITHUB_WORKSPACE}"/dist/*.tar.gz )
            fi
            test "${#ARTIFACT[@]}" -eq 1
            ENV_DIR="${SMOKE_ROOT}/${KIND}-venv"
            OUTPUT_DIR="${SMOKE_ROOT}/${KIND}-output"
            mkdir -p "${OUTPUT_DIR}"
            uv venv --python "${{ matrix.python-version }}" "${ENV_DIR}"
            uv pip install --python "${ENV_DIR}/bin/python" "${ARTIFACT[0]}"
            (
              cd "${OUTPUT_DIR}"
              "${ENV_DIR}/bin/sdr-grader" --version
              "${ENV_DIR}/bin/sdr-grader" \
                "${GITHUB_WORKSPACE}/tests/fixtures/cja_snapshot_messy.json" \
                --output cja.html --json cja.json --quiet
              "${ENV_DIR}/bin/sdr-grader" \
                "${GITHUB_WORKSPACE}/tests/fixtures/aa_snapshot_messy.json" \
                --output aa.html --json aa.json --quiet
              "${ENV_DIR}/bin/python" -c \
                'from importlib.resources import files; root=files("sdr_grader"); required=("plugin/.claude-plugin/plugin.json","plugin/.claude-plugin/marketplace.json","plugin/skills/sdr-grader/SKILL.md","rules/packs/strict/_meta.yaml","render/templates/report.html.j2","render/static/report.css","data/distribution.json"); missing=[p for p in required if not root.joinpath(p).is_file()]; assert not missing, missing'
            )
          done
          for OUTPUT in aa.html aa.json cja.html cja.json; do
            cmp \
              "${SMOKE_ROOT}/wheel-output/${OUTPUT}" \
              "${SMOKE_ROOT}/sdist-output/${OUTPUT}"
          done

  plugin-smoke:
    name: Frozen wheel Claude plugin smoke
    needs: [candidate, build, recover]
    if: >-
      ${{
        always() &&
        needs.candidate.result == 'success' &&
        !(github.event_name == 'workflow_dispatch' && inputs.scenario == 'skip') &&
        (needs.build.result == 'success' || needs.recover.result == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.16

      - name: Set up Python
        run: uv python install 3.12

      - name: Fetch frozen release candidate
        uses: ./.github/actions/fetch-release-candidate
        with:
          token: ${{ github.token }}
          version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          harness: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Install frozen wheel and materialize its plugin
        shell: bash
        run: |
          set -euo pipefail
          WHEELS=(dist/*.whl)
          test "${#WHEELS[@]}" -eq 1
          PLUGIN_ENV="${RUNNER_TEMP}/plugin-venv"
          PLUGIN_ROOT="${RUNNER_TEMP}/frozen-plugin"
          uv venv --python 3.12 "${PLUGIN_ENV}"
          uv pip install --python "${PLUGIN_ENV}/bin/python" "${WHEELS[0]}"
          "${PLUGIN_ENV}/bin/python" - "${PLUGIN_ROOT}" <<'PY'
          import shutil
          import sys
          from importlib.resources import files
          from pathlib import Path

          source = Path(str(files("sdr_grader").joinpath("plugin")))
          target = Path(sys.argv[1])
          shutil.copytree(source, target)
          PY

      - name: Validate and install Claude plugin from frozen wheel
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @anthropic-ai/claude-code@2.1.220
          PLUGIN_ENV="${RUNNER_TEMP}/plugin-venv"
          PLUGIN_ROOT="${RUNNER_TEMP}/frozen-plugin"
          STRICT_PLUGIN_ROOT="${RUNNER_TEMP}/strict-plugin"
          claude plugin validate "${PLUGIN_ROOT}" --strict
          mkdir -p "${STRICT_PLUGIN_ROOT}/.claude-plugin"
          mkdir -p "${STRICT_PLUGIN_ROOT}/skills"
          cp \
            "${PLUGIN_ROOT}/.claude-plugin/plugin.json" \
            "${STRICT_PLUGIN_ROOT}/.claude-plugin/plugin.json"
          cp -R \
            "${PLUGIN_ROOT}/skills/sdr-grader" \
            "${STRICT_PLUGIN_ROOT}/skills/"
          claude plugin validate "${STRICT_PLUGIN_ROOT}" --strict
          export CLAUDE_CONFIG_DIR="${RUNNER_TEMP}/claude-profile"
          claude plugin marketplace add "${PLUGIN_ROOT}" --scope user
          claude plugin install sdr-grader@sdr-grader --scope user
          "${PLUGIN_ENV}/bin/sdr-grader" tests/fixtures/cja_snapshot_messy.json \
            --output "${RUNNER_TEMP}/plugin-grade.html" \
            --json "${RUNNER_TEMP}/plugin-grade.json" --quiet
          SUPPRESS_CONFIG="${RUNNER_TEMP}/compare-suppression.yaml"
          printf '%s\n' \
            'suppress:' \
            '  - rule: CALC-014' \
            '    reason: plugin compare smoke' \
            > "${SUPPRESS_CONFIG}"
          "${PLUGIN_ENV}/bin/sdr-grader" tests/fixtures/cja_snapshot_messy.json \
            --suppress-config "${SUPPRESS_CONFIG}" \
            --output "${RUNNER_TEMP}/plugin-grade-suppressed.html" \
            --json "${RUNNER_TEMP}/plugin-grade-suppressed.json" --quiet
          INSTALL_PATH="$(
            claude plugin list --json |
              python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["installPath"])'
          )"
          HELPER="${INSTALL_PATH}/skills/sdr-grader/scripts/query_grade.py"
          python3 "${HELPER}" summary "${RUNNER_TEMP}/plugin-grade.json"
          python3 "${HELPER}" findings "${RUNNER_TEMP}/plugin-grade.json" --category "schema hygiene"
          python3 "${HELPER}" show "${RUNNER_TEMP}/plugin-grade.json" CALC-014
          python3 "${HELPER}" compare \
            "${RUNNER_TEMP}/plugin-grade.json" \
            "${RUNNER_TEMP}/plugin-grade-suppressed.json"

  # Build and recovery are mutually exclusive. Override skipped ancestors
  # while requiring every direct prerequisite to succeed before continuing.
  verify-prepublication:
    name: Verify tagged README before publication
    needs: [install-smoke, plugin-smoke]
    if: ${{ always() && !cancelled() && needs.install-smoke.result == 'success' && needs.plugin-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.16

      - name: Set up Python
        run: uv python install 3.12

      - name: Fetch frozen release candidate
        uses: ./.github/actions/fetch-release-candidate
        with:
          token: ${{ github.token }}
          version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          harness: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Verify candidate description and bounded live tag links
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          python3 scripts/verify_published_readme.py prepublication \
            --dist-dir dist \
            --evidence release-evidence/release-artifacts.json \
            --version "${RELEASE_VERSION#v}"

      - name: Verify fixture prepublication with production validators
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/release_verifier_fixture.py prepublication --dist-dir dist

  draft-github:
    name: Create immutable GitHub draft
    needs: verify-prepublication
    if: ${{ always() && !cancelled() && needs.verify-prepublication.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Fetch frozen release candidate
        uses: ./.github/actions/fetch-release-candidate
        with:
          token: ${{ github.token }}
          version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          harness: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Inspect existing GitHub release
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          RELEASE_METADATA="$(
            gh release view "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets,isDraft,tagName 2>&1
          )"
          RELEASE_STATUS=$?
          set -e
          if [ "${RELEASE_STATUS}" -eq 0 ]; then
            printf '%s\n' "${RELEASE_METADATA}" > release-metadata.json
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          elif [ "${RELEASE_METADATA}" = "release not found" ]; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' "${RELEASE_METADATA}" >&2
            exit "${RELEASE_STATUS}"
          fi

      - name: Verify existing GitHub release assets
        if: ${{ github.event_name != 'workflow_dispatch' && steps.release-state.outputs.exists == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_github_release_assets.py \
            --release-metadata release-metadata.json \
            --evidence release-evidence/release-artifacts.json \
            --dist-dir dist \
            --expected-tag "${GITHUB_REF_NAME}" --release-state either

      - name: Create draft from tested bytes
        if: ${{ github.event_name != 'workflow_dispatch' && steps.release-state.outputs.exists != 'true' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            release-evidence/release-artifacts.json

  publish-pypi:
    name: Publish PyPI and attest
    needs: draft-github
    if: ${{ always() && !cancelled() && needs.draft-github.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'release-verifier-harness' || 'pypi' }}
      url: https://pypi.org/p/sdr-grader
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Fetch frozen release candidate
        uses: ./.github/actions/fetch-release-candidate
        with:
          token: ${{ github.token }}
          version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          harness: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Verify recoverable PyPI state
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: pypi-state
        run: |
          STATE="$(
            python3 scripts/check_pypi_release_state.py \
              --dist-dir dist \
              --project sdr-grader \
              --version "${RELEASE_VERSION#v}"
          )"
          printf 'state=%s\n' "${STATE}" >> "${GITHUB_OUTPUT}"

      - name: Publish exact candidate to PyPI
        if: ${{ github.event_name != 'workflow_dispatch' && steps.pypi-state.outputs.state != 'matching' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          print-hash: true
          skip-existing: true

      - name: Attest published distributions
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

  verify-pypi-publication:
    name: Verify PyPI publication before announcement
    needs: publish-pypi
    if: ${{ always() && !cancelled() && needs.publish-pypi.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.16

      - name: Set up Python
        run: uv python install 3.12

      - name: Fetch frozen release candidate
        uses: ./.github/actions/fetch-release-candidate
        with:
          token: ${{ github.token }}
          version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          harness: ${{ github.event_name == 'workflow_dispatch' }}
          dist_dir: candidate-dist

      - name: Verify PyPI description, bytes, and bounded links
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          python3 scripts/verify_published_readme.py postpublication \
            --dist-dir candidate-dist \
            --evidence release-evidence/release-artifacts.json \
            --version "${RELEASE_VERSION#v}"

      - name: Verify fixture postpublication with production validators
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/release_verifier_fixture.py postpublication --dist-dir candidate-dist

  publish-github:
    name: Publish GitHub release
    needs: verify-pypi-publication
    if: ${{ always() && !cancelled() && needs.verify-pypi-publication.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'release-verifier-harness' || 'github-release' }}
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Publish the existing draft
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest

  verify-public:
    name: Public endpoints / Python ${{ matrix.python-version }}
    needs: publish-github
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.16

      - name: Fetch frozen release candidate
        uses: ./.github/actions/fetch-release-candidate
        with:
          token: ${{ github.token }}
          version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          harness: ${{ github.event_name == 'workflow_dispatch' }}
          dist_dir: candidate-dist
          source: ${{ github.event_name == 'workflow_dispatch' && 'artifacts' || 'public' }}

      - name: Verify matching public metadata and bytes before installation
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          python3 scripts/verify_published_readme.py postpublication \
            --dist-dir candidate-dist \
            --evidence release-evidence/release-artifacts.json \
            --version "${RELEASE_VERSION#v}"

      - name: Verify fixture postpublication with production validators
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/release_verifier_fixture.py postpublication --dist-dir candidate-dist

      - name: Controlled public verifier fault
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/release_verifier_fixture.py fault --python-version "${{ matrix.python-version }}"

      - name: Compare fresh public install with candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION#v}"
          PUBLIC_ENV="${RUNNER_TEMP}/public-venv"
          CANDIDATE_ENV="${RUNNER_TEMP}/candidate-venv"
          PUBLIC_OUT="${RUNNER_TEMP}/public-output"
          CANDIDATE_OUT="${RUNNER_TEMP}/candidate-output"
          mkdir -p "${PUBLIC_OUT}" "${CANDIDATE_OUT}"
          uv venv --python "${{ matrix.python-version }}" "${PUBLIC_ENV}"
          uv venv --python "${{ matrix.python-version }}" "${CANDIDATE_ENV}"
          if [ "${HARNESS_MODE}" = true ]; then
            python3 scripts/release_verifier_fixture.py install \
              --python "${PUBLIC_ENV}/bin/python" --dist-dir candidate-dist \
              --python-version "${{ matrix.python-version }}"
          else
            python3 scripts/install_public_release.py \
              --python "${PUBLIC_ENV}/bin/python" --version "${VERSION}" \
              --dist-dir candidate-dist --evidence release-evidence/release-artifacts.json \
              --output "${RUNNER_TEMP}/public-install-evidence.json"
          fi
          uv pip install --python "${CANDIDATE_ENV}/bin/python" candidate-dist/*.whl
          for TARGET in public candidate; do
            if [ "${TARGET}" = "public" ]; then
              ENV_DIR="${PUBLIC_ENV}"
              OUTPUT_DIR="${PUBLIC_OUT}"
            else
              ENV_DIR="${CANDIDATE_ENV}"
              OUTPUT_DIR="${CANDIDATE_OUT}"
            fi
            (
              cd "${OUTPUT_DIR}"
              "${ENV_DIR}/bin/sdr-grader" --version
              "${ENV_DIR}/bin/sdr-grader" \
                "${GITHUB_WORKSPACE}/tests/fixtures/cja_snapshot_messy.json" \
                --output cja.html --json cja.json --quiet
              "${ENV_DIR}/bin/sdr-grader" \
                "${GITHUB_WORKSPACE}/tests/fixtures/aa_snapshot_messy.json" \
                --output aa.html --json aa.json --quiet
            )
          done
          for OUTPUT in aa.html aa.json cja.html cja.json; do
            cmp "${PUBLIC_OUT}/${OUTPUT}" "${CANDIDATE_OUT}/${OUTPUT}"
          done
          "${PUBLIC_ENV}/bin/python" -c \
            'from importlib.resources import files; root=files("sdr_grader"); required=("plugin/.claude-plugin/plugin.json","plugin/.claude-plugin/marketplace.json","plugin/skills/sdr-grader/SKILL.md","rules/packs/strict/_meta.yaml","render/templates/report.html.j2","render/static/report.css","data/distribution.json"); missing=[p for p in required if not root.joinpath(p).is_file()]; assert not missing, missing'

      - name: Retain public installation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-install-${{ matrix.python-version }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-install-evidence.json
            ${{ runner.temp }}/fixture-endpoint-evidence.json
          if-no-files-found: warn
          retention-days: 90

  verify-completion:
    name: Require complete release verification
    needs: [candidate, build, recover, install-smoke, plugin-smoke, verify-prepublication, draft-github, publish-pypi, verify-pypi-publication, publish-github, verify-public]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Recover published identity read-only
        uses: ./.github/actions/fetch-release-candidate
        with:
          source: ${{ github.event_name == 'workflow_dispatch' && 'artifacts' || 'public' }}
          token: ${{ github.token }}
          version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          harness: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Assert actual hosted matrix completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify_release_completion.py \
            --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}" --source-sha "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" --evidence release-evidence/release-artifacts.json \
            --output release-completion.json
      - name: Retain completion evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-completion-${{ github.sha }}-${{ github.run_attempt }}
          path: release-completion.json
          if-no-files-found: error
          retention-days: 90
