name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.16
          enable-cache: true
          prune-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev

      - name: Verify immutable candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 scripts/check_version_sync.py --tag "${GITHUB_REF_NAME}"

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest --cov=src/sdr_grader --cov-report=term

  build:
    name: Build immutable distributions
    needs: candidate
    # A failed immutable build requires a fixed source and new version. Rerunning
    # failed verifier jobs may reuse retained artifacts, but no run may rebuild.
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.16

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify immutable candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 scripts/check_version_sync.py --tag "${GITHUB_REF_NAME}"

      - name: Build wheel from sdist
        run: uv build --no-sources --clear --no-create-gitignore

      - name: Install hash-locked release validation tools
        run: |
          uv venv --python 3.12 .release-validation
          uv pip install \
            --python .release-validation/bin/python \
            --require-hashes -r requirements/release-validation.txt

      - name: Validate distribution descriptions strictly
        run: .release-validation/bin/twine check --strict dist/*

      - name: Verify artifact inventory and provenance
        run: |
          mkdir -p release-evidence
          .release-validation/bin/python scripts/verify_release_artifacts.py \
            --dist-dir dist \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --source-sha "${GITHUB_SHA}" \
            --output release-evidence/release-artifacts.json

      - name: Upload immutable distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-evidence-${{ github.sha }}
          path: release-evidence/release-artifacts.json
          if-no-files-found: error
          retention-days: 30

  install-smoke:
    name: Artifact smoke / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.16

      - name: Download immutable distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-dist-${{ github.sha }}
          path: dist/

      - name: Download candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-evidence-${{ github.sha }}
          path: release-evidence/

      - name: Verify retained candidate digests
        run: |
          python3 scripts/verify_published_readme.py candidate \
            --dist-dir dist \
            --evidence release-evidence/release-artifacts.json \
            --version "${GITHUB_REF_NAME#v}"

      - name: Install wheel and sdist outside checkout and compare behavior
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_ROOT="${RUNNER_TEMP}/artifact-smoke-${{ matrix.python-version }}"
          mkdir -p "${SMOKE_ROOT}"
          for KIND in wheel sdist; do
            if [ "${KIND}" = "wheel" ]; then
              ARTIFACT=( "${GITHUB_WORKSPACE}"/dist/*.whl )
            else
              ARTIFACT=( "${GITHUB_WORKSPACE}"/dist/*.tar.gz )
            fi
            test "${#ARTIFACT[@]}" -eq 1
            ENV_DIR="${SMOKE_ROOT}/${KIND}-venv"
            OUTPUT_DIR="${SMOKE_ROOT}/${KIND}-output"
            mkdir -p "${OUTPUT_DIR}"
            uv venv --python "${{ matrix.python-version }}" "${ENV_DIR}"
            uv pip install --python "${ENV_DIR}/bin/python" "${ARTIFACT[0]}"
            (
              cd "${OUTPUT_DIR}"
              "${ENV_DIR}/bin/sdr-grader" --version
              "${ENV_DIR}/bin/sdr-grader" \
                "${GITHUB_WORKSPACE}/tests/fixtures/cja_snapshot_messy.json" \
                --output cja.html --json cja.json --quiet
              "${ENV_DIR}/bin/sdr-grader" \
                "${GITHUB_WORKSPACE}/tests/fixtures/aa_snapshot_messy.json" \
                --output aa.html --json aa.json --quiet
              "${ENV_DIR}/bin/python" -c \
                'from importlib.resources import files; root=files("sdr_grader"); required=("plugin/.claude-plugin/plugin.json","plugin/.claude-plugin/marketplace.json","plugin/skills/sdr-grader/SKILL.md","rules/packs/strict/_meta.yaml","render/templates/report.html.j2","render/static/report.css","data/distribution.json"); missing=[p for p in required if not root.joinpath(p).is_file()]; assert not missing, missing'
            )
          done
          for OUTPUT in aa.html aa.json cja.html cja.json; do
            cmp \
              "${SMOKE_ROOT}/wheel-output/${OUTPUT}" \
              "${SMOKE_ROOT}/sdist-output/${OUTPUT}"
          done

  plugin-smoke:
    name: Frozen wheel Claude plugin smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.16

      - name: Set up Python
        run: uv python install 3.12

      - name: Download immutable distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-dist-${{ github.sha }}
          path: dist/

      - name: Download candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-evidence-${{ github.sha }}
          path: release-evidence/

      - name: Verify retained candidate digests
        run: |
          python3 scripts/verify_published_readme.py candidate \
            --dist-dir dist \
            --evidence release-evidence/release-artifacts.json \
            --version "${GITHUB_REF_NAME#v}"

      - name: Install frozen wheel and materialize its plugin
        shell: bash
        run: |
          set -euo pipefail
          WHEELS=(dist/*.whl)
          test "${#WHEELS[@]}" -eq 1
          PLUGIN_ENV="${RUNNER_TEMP}/plugin-venv"
          PLUGIN_ROOT="${RUNNER_TEMP}/frozen-plugin"
          uv venv --python 3.12 "${PLUGIN_ENV}"
          uv pip install --python "${PLUGIN_ENV}/bin/python" "${WHEELS[0]}"
          "${PLUGIN_ENV}/bin/python" - "${PLUGIN_ROOT}" <<'PY'
          import shutil
          import sys
          from importlib.resources import files
          from pathlib import Path

          source = Path(str(files("sdr_grader").joinpath("plugin")))
          target = Path(sys.argv[1])
          shutil.copytree(source, target)
          PY

      - name: Validate and install Claude plugin from frozen wheel
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @anthropic-ai/claude-code@2.1.220
          PLUGIN_ENV="${RUNNER_TEMP}/plugin-venv"
          PLUGIN_ROOT="${RUNNER_TEMP}/frozen-plugin"
          STRICT_PLUGIN_ROOT="${RUNNER_TEMP}/strict-plugin"
          claude plugin validate "${PLUGIN_ROOT}" --strict
          mkdir -p "${STRICT_PLUGIN_ROOT}/.claude-plugin"
          mkdir -p "${STRICT_PLUGIN_ROOT}/skills"
          cp \
            "${PLUGIN_ROOT}/.claude-plugin/plugin.json" \
            "${STRICT_PLUGIN_ROOT}/.claude-plugin/plugin.json"
          cp -R \
            "${PLUGIN_ROOT}/skills/sdr-grader" \
            "${STRICT_PLUGIN_ROOT}/skills/"
          claude plugin validate "${STRICT_PLUGIN_ROOT}" --strict
          export CLAUDE_CONFIG_DIR="${RUNNER_TEMP}/claude-profile"
          claude plugin marketplace add "${PLUGIN_ROOT}" --scope user
          claude plugin install sdr-grader@sdr-grader --scope user
          "${PLUGIN_ENV}/bin/sdr-grader" tests/fixtures/cja_snapshot_messy.json \
            --output "${RUNNER_TEMP}/plugin-grade.html" \
            --json "${RUNNER_TEMP}/plugin-grade.json" --quiet
          SUPPRESS_CONFIG="${RUNNER_TEMP}/compare-suppression.yaml"
          printf '%s\n' \
            'suppress:' \
            '  - rule: CALC-014' \
            '    reason: plugin compare smoke' \
            > "${SUPPRESS_CONFIG}"
          "${PLUGIN_ENV}/bin/sdr-grader" tests/fixtures/cja_snapshot_messy.json \
            --suppress-config "${SUPPRESS_CONFIG}" \
            --output "${RUNNER_TEMP}/plugin-grade-suppressed.html" \
            --json "${RUNNER_TEMP}/plugin-grade-suppressed.json" --quiet
          INSTALL_PATH="$(
            claude plugin list --json |
              python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["installPath"])'
          )"
          HELPER="${INSTALL_PATH}/skills/sdr-grader/scripts/query_grade.py"
          python3 "${HELPER}" summary "${RUNNER_TEMP}/plugin-grade.json"
          python3 "${HELPER}" findings "${RUNNER_TEMP}/plugin-grade.json" --category "schema hygiene"
          python3 "${HELPER}" show "${RUNNER_TEMP}/plugin-grade.json" CALC-014
          python3 "${HELPER}" compare \
            "${RUNNER_TEMP}/plugin-grade.json" \
            "${RUNNER_TEMP}/plugin-grade-suppressed.json"

  verify-prepublication:
    name: Verify tagged README before publication
    needs: [install-smoke, plugin-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.16

      - name: Set up Python
        run: uv python install 3.12

      - name: Download immutable distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-dist-${{ github.sha }}
          path: dist/

      - name: Download candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-evidence-${{ github.sha }}
          path: release-evidence/

      - name: Verify candidate description and bounded live tag links
        run: |
          python3 scripts/verify_published_readme.py prepublication \
            --dist-dir dist \
            --evidence release-evidence/release-artifacts.json \
            --version "${GITHUB_REF_NAME#v}"

  draft-github:
    name: Create immutable GitHub draft
    needs: verify-prepublication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download immutable distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-dist-${{ github.sha }}
          path: dist/

      - name: Download candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-evidence-${{ github.sha }}
          path: release-evidence/

      - name: Create draft from tested bytes
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            release-evidence/release-artifacts.json

  publish-pypi:
    name: Publish PyPI and attest
    needs: draft-github
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/sdr-grader
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Download immutable distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-dist-${{ github.sha }}
          path: dist/

      - name: Download candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-evidence-${{ github.sha }}
          path: release-evidence/

      - name: Verify retained candidate digests
        run: |
          python3 scripts/verify_published_readme.py candidate \
            --dist-dir dist \
            --evidence release-evidence/release-artifacts.json \
            --version "${GITHUB_REF_NAME#v}"

      - name: Verify recoverable PyPI state
        id: pypi-state
        run: |
          STATE="$(
            python3 scripts/check_pypi_release_state.py \
              --dist-dir dist \
              --project sdr-grader \
              --version "${GITHUB_REF_NAME#v}"
          )"
          printf 'state=%s\n' "${STATE}" >> "${GITHUB_OUTPUT}"

      - name: Publish exact candidate to PyPI
        if: steps.pypi-state.outputs.state != 'matching'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          print-hash: true
          skip-existing: true

      - name: Attest published distributions
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"

  verify-pypi-publication:
    name: Verify PyPI publication before announcement
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.16

      - name: Set up Python
        run: uv python install 3.12

      - name: Download candidate distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-dist-${{ github.sha }}
          path: candidate-dist/

      - name: Download candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-evidence-${{ github.sha }}
          path: release-evidence/

      - name: Verify PyPI description, bytes, and bounded links
        run: |
          python3 scripts/verify_published_readme.py postpublication \
            --dist-dir candidate-dist \
            --evidence release-evidence/release-artifacts.json \
            --version "${GITHUB_REF_NAME#v}"

  publish-github:
    name: Publish GitHub release
    needs: verify-pypi-publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Publish the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest

  verify-public:
    name: Public endpoints / Python ${{ matrix.python-version }}
    needs: publish-github
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.16

      - name: Download candidate distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-dist-${{ github.sha }}
          path: candidate-dist/

      - name: Download candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-evidence-${{ github.sha }}
          path: release-evidence/

      - name: Verify GitHub release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p github-dist
          gh release download "${GITHUB_REF_NAME}" \
            --pattern "*.whl" --pattern "*.tar.gz" --dir github-dist
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("release-evidence/release-artifacts.json").read_text()
          )
          expected = {
              item["filename"]: item for item in evidence["artifacts"]
          }

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for root in (Path("candidate-dist"), Path("github-dist")):
              for filename, record in expected.items():
                  path = root / filename
                  assert path.stat().st_size == record["size"]
                  assert digest(path) == record["sha256"]
          PY

      - name: Verify build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ARTIFACT in candidate-dist/*; do
            gh attestation verify "${ARTIFACT}" --repo "${GITHUB_REPOSITORY}"
          done

      - name: Compare fresh public install with candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PUBLIC_ENV="${RUNNER_TEMP}/public-venv"
          CANDIDATE_ENV="${RUNNER_TEMP}/candidate-venv"
          PUBLIC_OUT="${RUNNER_TEMP}/public-output"
          CANDIDATE_OUT="${RUNNER_TEMP}/candidate-output"
          mkdir -p "${PUBLIC_OUT}" "${CANDIDATE_OUT}"
          uv venv --python "${{ matrix.python-version }}" "${PUBLIC_ENV}"
          uv venv --python "${{ matrix.python-version }}" "${CANDIDATE_ENV}"
          uv pip install --python "${PUBLIC_ENV}/bin/python" "sdr-grader==${VERSION}"
          uv pip install --python "${CANDIDATE_ENV}/bin/python" candidate-dist/*.whl
          for TARGET in public candidate; do
            if [ "${TARGET}" = "public" ]; then
              ENV_DIR="${PUBLIC_ENV}"
              OUTPUT_DIR="${PUBLIC_OUT}"
            else
              ENV_DIR="${CANDIDATE_ENV}"
              OUTPUT_DIR="${CANDIDATE_OUT}"
            fi
            (
              cd "${OUTPUT_DIR}"
              "${ENV_DIR}/bin/sdr-grader" --version
              "${ENV_DIR}/bin/sdr-grader" \
                "${GITHUB_WORKSPACE}/tests/fixtures/cja_snapshot_messy.json" \
                --output cja.html --json cja.json --quiet
              "${ENV_DIR}/bin/sdr-grader" \
                "${GITHUB_WORKSPACE}/tests/fixtures/aa_snapshot_messy.json" \
                --output aa.html --json aa.json --quiet
            )
          done
          for OUTPUT in aa.html aa.json cja.html cja.json; do
            cmp "${PUBLIC_OUT}/${OUTPUT}" "${CANDIDATE_OUT}/${OUTPUT}"
          done
          "${PUBLIC_ENV}/bin/python" -c \
            'from importlib.resources import files; root=files("sdr_grader"); required=("plugin/.claude-plugin/plugin.json","plugin/.claude-plugin/marketplace.json","plugin/skills/sdr-grader/SKILL.md","rules/packs/strict/_meta.yaml","render/templates/report.html.j2","render/static/report.css","data/distribution.json"); missing=[p for p in required if not root.joinpath(p).is_file()]; assert not missing, missing'
