name: Bug report
description: A rule grades incorrectly, the CLI crashes, or output is wrong.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer a minimal **synthetic** snapshot and command that reproduce the bug,
        without production-derived values. Review logs, screenshots, and reports
        before posting them too.

        **Do not upload production-derived data here.** Sanitization produces a
        review candidate, not permission to share. Follow the
        [exact-byte human review and private-first sharing policy](https://github.com/brian-a-au/sdr-grader/blob/main/SECURITY.md#reporting-false-positives-on-private-data):
        contact the maintainer privately and agree on the minimum needed before
        uploading a production-derived candidate. Record approval against its
        exact SHA-256 digest; later edits need fresh review.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did the grader do? What did you expect it to do?
      placeholder: |
        Ran `sdr-grader snapshot.json --output grade.html`. SCH-003 fired
        with "170 components lack descriptions" but the snapshot has
        descriptions on every component.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Minimal command + minimal synthetic snapshot. Inline or attach only
        synthetic data; use the private-first policy above for production-derived data.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: sdr-grader version
      description: Output of `sdr-grader --version` (or commit SHA if running from source).
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - CJA (cja_auto_sdr snapshot)
        - AA (aa_auto_sdr snapshot)
        - Both / not platform-specific
    validations:
      required: true

  - type: input
    id: pack
    attributes:
      label: Rubric pack
      description: Which pack was active? Default is `strict`.
      placeholder: "strict"

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Logs, screenshots of the rendered report, related issues.
