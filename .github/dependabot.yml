# Weekly individual Python updates; GitHub Actions remain grouped for manual review.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

  # requirements/release-validation.txt is a universal, hash-locked file that
  # only `uv pip compile --universal` can regenerate correctly. Dependabot's pip
  # updater drops its environment markers (#131), so ignore every dependency
  # here, including security updates; alerts still appear and are fixed by hand.
  - package-ecosystem: "pip"
    directory: "/requirements"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
