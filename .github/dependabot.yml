# Weekly, grouped into one PR per ecosystem — matching sdr-visualizer.
# A dependency bump that changes rendered output fails the examples-drift
# check like any other change; regenerate examples/ in the Dependabot PR
# before merging.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      python:
        patterns: ["*"]
